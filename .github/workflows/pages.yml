name: Pages

on:
  push:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright install --with-deps webkit
      - run: npx playwright test --project=desktop --project=iphone --project=landscape --project=landscape-webkit

  deploy-preview:
    needs: test
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "CF_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; skipping preview deploy."
            exit 0
          fi
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "Refusing to deploy production from the preview job."
            exit 1
          fi
          if ! npx wrangler pages project list | grep -F "wildlife-migration-atlas"; then
            npx wrangler pages project create wildlife-migration-atlas --production-branch main
          fi
          npx wrangler pages deploy dist \
            --project-name=wildlife-migration-atlas \
            --branch="${GITHUB_REF_NAME}" \
            --commit-hash="${GITHUB_SHA}"

  deploy-production:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "CF_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; skipping production deploy."
            exit 0
          fi
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Refusing to deploy production from ${GITHUB_REF}."
            exit 1
          fi
          if ! npx wrangler pages project list | grep -F "wildlife-migration-atlas"; then
            npx wrangler pages project create wildlife-migration-atlas --production-branch main
          fi
          npx wrangler pages deploy dist \
            --project-name=wildlife-migration-atlas \
            --branch=main \
            --commit-hash="${GITHUB_SHA}"
